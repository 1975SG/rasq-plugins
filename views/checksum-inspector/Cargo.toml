[package]
name = "checksum-inspector"
version = "0.1.0"
edition = "2021"

[dependencies]
checksums = { path = "../../libs/checksums" }
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "iderm-plugins:checksum-inspector"
target = { world = "view-plugin", path = "wit/deps/iderm-plugin/iderm-plugin.wit" }

[package.metadata.component.dependencies]
